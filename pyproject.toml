[build-system]
requires = ["setuptools>=59.6"]
build-backend = "setuptools.build_meta"

[project]
name = "xbox-gamepad-physics"
version = "0.1.0"
description = "Evidence-bound Xbox One S physical asset and simulator adapters"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["numpy>=1.24", "trimesh>=4.4", "Pillow>=9", "coacd==1.0.14", "manifold3d==3.5.4"]
mujoco = ["mujoco==3.15.0", "typing_extensions>=4.16"]
robotwin = ["sapien==3.0.3"]

[project.scripts]
xbox-gamepad-physics = "xbox_gamepad_physics.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

# Code only: the release-time lock is the sole data file; resources come from the release zip or a local build.
[tool.setuptools.package-data]
xbox_gamepad_physics = ["_resource_lock.json"]

[tool.xbox-gamepad-physics]
full-test-input = "requirements/test.in"
tested-gpu-constraints = "requirements/gpu-tested.constraints.txt"
tested-gpu-freeze = "requirements/gpu-tested.freeze.txt"
regression-command = "python3 scripts/run_regression.py fast"
